<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brandbuild — Approvals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F4EF;color:#0F1A13;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0B7A3B}a:hover{color:#075A2B}
*{box-sizing:border-box}
.btn{cursor:pointer;border:0;font:inherit;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 150ms ease,box-shadow 150ms ease}
.btn:active{transform:scale(.97)}
:focus-visible{outline:2px solid #12A150;outline-offset:2px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;color:#3D4840;font-weight:500;font-size:15px;text-decoration:none;transition:background-color 150ms ease}
.nav.on{background:#E6F5EC;color:#0B5E2E;font-weight:600}
.cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#12A150;color:#FFFFFF;font-size:12px;font-weight:700;line-height:22px;text-align:center}
.pf{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#FFFFFF;font-size:9px;font-weight:700}
.item{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;text-align:left;width:100%}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise 240ms cubic-bezier(.23,1,.32,1) both}
@media (hover:hover) and (pointer:fine){.nav:not(.on):hover{background:#E9EBE4}.item:hover{background:#F7F8F4}.bp:hover{background:#0B7A3B}.bs:hover{background:#F3F4EF}}
@media (max-width:860px){.rail{display:none !important}.pad{padding:20px 16px 48px !important}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; width: 100%; background: #F3F4EF">
<nav class="rail" aria-label="Main" style="flex: 0 0 240px; display: flex; flex-direction: column; gap: 28px; padding: 24px 16px; background: #FBFBF8; border-right: 1px solid #E3E5DD">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #0F1A13; text-decoration: none">
    <svg width="23" height="26" viewBox="0 0 59 66" role="img" aria-label="Brandbuild"><path d="M0 63.1688V26.0688C0 24.7053 1.1053 23.6 2.46875 23.6H17.5359C18.8994 23.6 20.0047 24.7053 20.0047 26.0688V40.6953C20.0047 43.4222 22.2153 45.6328 24.9422 45.6328H31.6406C33.0041 45.6328 34.1094 46.7381 34.1094 48.1016V63.1688C34.1094 64.5322 33.0041 65.6375 31.6406 65.6375H2.46875C1.1053 65.6375 0 64.5322 0 63.1688Z" fill="#0F1A13"></path><path d="M24.8906 39.5688V2.46875C24.8906 1.1053 25.9959 0 27.3594 0H42.4266C43.79 0 44.8953 1.1053 44.8953 2.46875V17.0953C44.8953 19.8222 47.1059 22.0328 49.8328 22.0328H56.5313C57.8947 22.0328 59 23.1381 59 24.5016V39.5688C59 40.9322 57.8947 42.0375 56.5313 42.0375H27.3594C25.9959 42.0375 24.8906 40.9322 24.8906 39.5688Z" fill="#0F1A13"></path></svg>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em">Brandbuild</span>
  </a>
  <a class="btn" href="Composer.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; background: #12A150; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New post</a>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a class="nav" href="Main.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="nav" href="Calendar.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Calendar</a>
    <a class="nav" href="Drafts.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Drafts</a>
    <a class="nav on" href="Approvals.dc.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5h6v3H9z"></path><path d="M7 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1M9 14l2 2 4-4"></path></svg>Approvals<span class="cnt">{{waiting}}</span></a>
    <a class="nav" href="Analytics.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"></path></svg>Analytics</a>
    <a class="nav" href="BrandProfile.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.4-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.5-9-7.5z"></path></svg>Brand profile</a>
    <a class="nav" href="Settings.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8.5"></circle></svg>Settings</a>
  </div>
</nav>

<main class="pad" style="flex: 999 1 560px; min-width: 0; padding: 28px 40px 48px">
  <div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
    <header style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.03em">Approvals</h1>
      <span style="font-size: 15px; color: #5B655D">{{subline}}</span>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section aria-label="Posts to review" style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E5DD">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
          <button class="btn item" aria-current="{{it.cur}}" onClick="{{it.pick}}" style="background: {{it.bg}}; box-shadow: {{it.ring}}">
            <span style="display: flex; align-items: center; gap: 6px; width: 100%">
              <sc-for list="{{it.pfs}}" as="p" hint-placeholder-count="2"><span class="pf" style="background: {{p.bg}}">{{p.k}}</span></sc-for>
              <span style="margin-left: auto; height: 24px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 600; line-height: 24px; background: {{it.chipBg}}; color: {{it.chipFg}}">{{it.chip}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 600; color: #0F1A13">{{it.title}}</span>
            <span style="font-size: 13px; color: #5B655D">{{it.meta}}</span>
          </button>
        </sc-for>
      </section>

      <section aria-label="Review" style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E5DD">
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 18px; background: #E9EBE4; font-weight: 700">T</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">Tobi sent this for approval</strong><span style="font-size: 13px; color: #5B655D">{{cur.sent}} · wants it to go out {{cur.when}}</span></span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <div style="flex: 1 1 260px; border-radius: 18px; border: 1px solid #E3E5DD; overflow: hidden">
            <div role="img" aria-label="Post image placeholder" style="aspect-ratio: 1 / 1; background: #DCE6DE; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #3D4840">{{cur.photo}}</div>
          </div>
          <div style="flex: 1.3 1 300px; display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5B655D">Caption</span>
            <p style="margin: 0; font-size: 15px; line-height: 1.55">{{cur.caption}}</p>
            <p style="margin: 0; font-size: 14px; color: #0A5CA8">{{cur.tags}}</p>
            <a href="Composer.dc.html" style="align-self: flex-start; font-size: 14px; font-weight: 600">Edit before approving</a>
          </div>
        </div>

        <sc-if value="{{cur.isWaiting}}" hint-placeholder-val="{{true}}">
          <sc-if value="{{asking}}" hint-placeholder-val="{{false}}">
            <label class="rise" style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">What should Tobi change?
              <textarea rows="2" style="resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid #D5D9CF; font: inherit; font-size: 15px; font-weight: 400">Use the plum shade photo instead, it's the one people asked about.</textarea>
            </label>
          </sc-if>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid #EEF0EA">
            <button class="btn bp" onClick="{{approve}}" style="height: 48px; padding: 0 20px; border-radius: 14px; background: #12A150; color: #FFFFFF; font-size: 15px; font-weight: 600">Approve and schedule</button>
            <button class="btn bs" onClick="{{ask}}" style="height: 48px; padding: 0 18px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C7CCC1; color: #0F1A13; font-size: 15px; font-weight: 600">{{askLabel}}</button>
            <button class="btn" onClick="{{reject}}" style="margin-left: auto; height: 48px; padding: 0 14px; border-radius: 14px; background: transparent; color: #B42318; font-size: 15px; font-weight: 600">Reject</button>
          </div>
        </sc-if>
        <sc-if value="{{cur.isDone}}" hint-placeholder-val="{{false}}">
          <div role="status" class="rise" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: {{cur.doneBg}}; color: {{cur.doneFg}}; font-size: 15px">
            <span style="flex: 1">{{cur.doneText}}</span>
            <button class="btn" onClick="{{undo}}" style="height: 36px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; color: #0F1A13; font-size: 14px; font-weight: 600">Undo</button>
          </div>
        </sc-if>
      </section>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
var IG = { k: 'IG', bg: '#D62976' }, LI = { k: 'in', bg: '#0A66C2' }, TT = { k: 'TT', bg: '#111111' };
var POSTS = [
  { title: 'Halloween shade picks', pfs: [IG, TT], sent: 'Sent 1 hour ago', when: 'Sat 31 Oct, 6:00 PM', photo: '[PHOTO: three shades]', caption: 'Three shades, three moods. Which one are you wearing on the 31st? Tell us in the comments and we’ll pick one winner for a free gloss.', tags: '#halloween #lipgloss #smallbusiness' },
  { title: 'Meet the team: who packs your order', pfs: [IG, LI], sent: 'Sent 3 hours ago', when: 'Mon 2 Nov, 12:30 PM', photo: '[PHOTO: team at packing table]', caption: 'Meet the two people who wrap, seal and write the note on every box. Say hi to Tobi and Ada.', tags: '#meettheteam #smallbusiness' },
  { title: 'Customer shout-out: Adaeze’s unboxing', pfs: [IG], sent: 'Sent yesterday', when: 'Thu 29 Oct, 6:00 PM', photo: '[PHOTO: customer unboxing]', caption: 'Adaeze filmed her unboxing and we haven’t stopped smiling. Thank you for sharing it with us.', tags: '#customerlove #lipgloss' }
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 0, st: ['waiting', 'waiting', 'waiting'], asking: false }; }
  set(v) { var st = this.state.st.slice(); st[this.state.sel] = v; this.setState({ st: st, asking: false }); }
  renderVals() {
    var s = this.state, self = this;
    var CH = { waiting: ['Waiting', '#E7F1FB', '#0A3D73'], approved: ['Approved', '#E6F5EC', '#0B5E2E'], changes: ['Changes asked', '#FFF1D6', '#6B4300'], rejected: ['Rejected', '#FDECEA', '#8F1D14'] };
    var items = POSTS.map(function (p, i) {
      var on = i === s.sel, c = CH[s.st[i]];
      return { title: p.title, pfs: p.pfs, meta: p.sent + ' · ' + p.when, chip: c[0], chipBg: c[1], chipFg: c[2], cur: on ? 'true' : 'false', bg: on ? '#F2FAF5' : 'transparent', ring: on ? 'inset 0 0 0 2px #12A150' : 'none', pick: function () { self.setState({ sel: i, asking: false }); } };
    });
    var p = POSTS[s.sel], v = s.st[s.sel];
    var DONE = { approved: ['Approved. Scheduled for ' + p.when + '. Tobi has been told.', '#E6F5EC', '#0B3D20'], changes: ['Sent back to Tobi with your note.', '#FFF1D6', '#4A2E00'], rejected: ['Rejected. Tobi has been told and the post is back in drafts.', '#FDECEA', '#5C130D'] };
    var d = DONE[v] || ['', '', ''];
    var waiting = s.st.filter(function (x) { return x === 'waiting'; }).length;
    return {
      items: items, waiting: waiting,
      subline: waiting ? waiting + ' waiting for you · oldest sent yesterday' : 'All caught up',
      cur: Object.assign({}, p, { isWaiting: v === 'waiting', isDone: v !== 'waiting', doneText: d[0], doneBg: d[1], doneFg: d[2] }),
      asking: s.asking, askLabel: s.asking ? 'Send back with note' : 'Request changes',
      approve: function () { self.set('approved'); },
      ask: function () { if (self.state.asking) self.set('changes'); else self.setState({ asking: true }); },
      reject: function () { self.set('rejected'); },
      undo: function () { self.set('waiting'); }
    };
  }
}
</script>
</body>
</html>
