      <h1 style="margin: 0 auto 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.03em">Drafts <span style="color: #9AA39C">6</span></h1>
      <label style="position: relative; display: flex; align-items: center">

    <div role="tablist" aria-label="Filter drafts" style="display: flex; gap: 8px; flex-wrap: wrap">
      <button class="btn" role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 10px; background: #0F1A13; color: #FFFFFF; font-size: 14px; font-weight: 600">All 6</button>

          <h2 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3">{{d.title}}</h2>

            <button class="btn btn-ghost" aria-label="More actions for {{d.title}}" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: transparent; color: #3D4840">
