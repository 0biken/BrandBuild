<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brandbuild mobile — Schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.btn{cursor:pointer;border:0;font:inherit;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 150ms ease}
.btn:active{transform:scale(.97)}
:focus-visible{outline:2px solid #12A150;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3F4EF; color: #0F1A13; font-family: Geist, system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 100px">

    <header style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0 auto 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.03em">October</h1>
      <div role="radiogroup" aria-label="View" style="display: inline-flex; padding: 3px; border-radius: 11px; background: #E9EBE4">
        <button class="btn" role="radio" aria-checked="false" style="height: 34px; padding: 0 12px; border-radius: 8px; background: transparent; color: #3D4840; font-size: 13px; font-weight: 600">Month</button>
        <button class="btn" role="radio" aria-checked="true" style="height: 34px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; color: #0F1A13; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(15,26,19,0.12)">Agenda</button>
      </div>
    </header>

    <div role="tablist" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button class="btn" role="tab" aria-selected="{{d.sel}}" aria-label="{{d.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 66px; padding-top: 8px; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.8">{{d.dow}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1">{{d.n}}</span>
          <span style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot}}"></span>
        </button>
      </sc-for>
    </div>

    <section aria-label="Today" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B655D">Today · Sun 25</h2>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 1.5px dashed #C7CCC1">
        <span style="flex: 1; font-size: 14px; line-height: 1.4; color: #3D4840">Nothing planned. Sunday evenings are good for your audience.</span>
        <a class="btn" href="MobileComposer.dc.html" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 11px; background: #0F2A1B; color: #D4F25C; font-size: 14px; font-weight: 600; text-decoration: none">Suggest</a>
      </div>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B655D">{{g.label}}</h2>
        <sc-for list="{{g.posts}}" as="p" hint-placeholder-count="1">
          <a href="#" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; box-shadow: {{p.ring}}; color: inherit; text-decoration: none">
            <span style="display: flex; align-items: center; gap: 8px">
              <span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #3D4840">{{p.time}}</span>
              <sc-for list="{{p.pfs}}" as="pf" hint-placeholder-count="2">
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: {{pf.bg}}; color: #FFFFFF; font-size: 9px; font-weight: 700">{{pf.k}}</span>
              </sc-for>
              <span style="margin-left: auto; height: 24px; padding: 0 8px; border-radius: 7px; background: {{p.chipBg}}; color: {{p.chipFg}}; font-size: 12px; font-weight: 600; line-height: 24px">{{p.status}}</span>
            </span>
            <span style="font-size: 16px; font-weight: 600">{{p.title}}</span>
            <sc-if value="{{p.hold}}" hint-placeholder-val="{{false}}">
              <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6B4300">TikTok access expired.<span style="margin-left: auto; font-weight: 600; color: #4A2E00; text-decoration: underline">Reconnect</span></span>
            </sc-if>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-around; height: 84px; padding: 0 8px 16px; background: rgba(251,251,248,0.94); border-top: 1px solid #E3E5DD">
    <a href="MobileHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: #5B655D; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="MobileSchedule.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: #0B7A3B; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Calendar</a>
    <a class="btn" href="MobileComposer.dc.html" aria-label="New post" style="display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 17px; background: #12A150; color: #FFFFFF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: #5B655D; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"></path></svg>Analytics</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; color: #5B655D; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Account</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var withPosts = { 26: true, 28: true, 29: true, 30: true };
    var days = [];
    for (var i = 0; i < 7; i++) {
      var n = 25 + i, sel = i === 0;
      days.push({ dow: dows[i], n: n, sel: sel ? 'true' : 'false', aria: dows[i] + ' ' + n + (withPosts[n] ? ', has posts' : ''), bg: sel ? '#12A150' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#0F1A13', dot: withPosts[n] ? (sel ? '#FFFFFF' : '#12A150') : 'transparent' });
    }
    var IG = { k: 'IG', bg: '#D62976' }, LI = { k: 'in', bg: '#0A66C2' }, TT = { k: 'TT', bg: '#111111' };
    var S = { status: 'Scheduled', chipBg: '#E6F5EC', chipFg: '#0B5E2E', ring: 'inset 0 0 0 1px #E3E5DD', hold: false };
    var groups = [
      { label: 'Mon 26', posts: [{ time: '7:00 PM', title: 'Weekend drop prep', pfs: [IG, TT], status: 'On hold', chipBg: '#FFF1D6', chipFg: '#6B4300', ring: 'inset 0 0 0 1px #E5C98F', hold: true }] },
      { label: 'Wed 28', posts: [Object.assign({ time: '12:30 PM', title: 'Shade lineup', pfs: [IG, LI] }, S)] },
      { label: 'Thu 29', posts: [Object.assign({ time: '6:00 PM', title: 'Customer shout-out', pfs: [IG] }, S)] }
    ];
    return { days: days, groups: groups };
  }
}
</script>
</body>
</html>
