<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brandbuild — Create your account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F4EF;color:#0F1A13;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0B7A3B}a:hover{color:#075A2B}
*{box-sizing:border-box}
.btn{cursor:pointer;border:0;font:inherit;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 150ms ease,box-shadow 150ms ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{cursor:not-allowed}
.btn[disabled]:active{transform:none}
:focus-visible{outline:2px solid #12A150;outline-offset:2px}
.in{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid #D5D9CF;background:#FFFFFF;font:inherit;font-size:16px;color:#0F1A13;transition:border-color 150ms ease,box-shadow 150ms ease}
.in:focus{outline:none;border-color:#12A150;box-shadow:0 0 0 3px rgba(18,161,80,0.18)}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.rule{display:flex;align-items:center;gap:8px;font-size:14px;transition:color 150ms ease}
@media (hover:hover) and (pointer:fine){.btn-primary:not([disabled]):hover{background:#0B7A3B}.btn-ghost:hover{background:#E9EBE4}}
@media (max-width:860px){.side{display:none !important}.formcol{padding:24px 16px 40px !important}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms !important}}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; width: 100%; background: #F3F4EF">
  <main class="formcol" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; padding: 32px 56px 48px">
    <a href="Landing.dc.html" style="display: flex; align-items: center; gap: 10px; color: #0F1A13; text-decoration: none">
      <svg width="23" height="26" viewBox="0 0 59 66" role="img" aria-label="Brandbuild"><path d="M0 63.1688V26.0688C0 24.7053 1.1053 23.6 2.46875 23.6H17.5359C18.8994 23.6 20.0047 24.7053 20.0047 26.0688V40.6953C20.0047 43.4222 22.2153 45.6328 24.9422 45.6328H31.6406C33.0041 45.6328 34.1094 46.7381 34.1094 48.1016V63.1688C34.1094 64.5322 33.0041 65.6375 31.6406 65.6375H2.46875C1.1053 65.6375 0 64.5322 0 63.1688Z" fill="#0F1A13"></path><path d="M24.8906 39.5688V2.46875C24.8906 1.1053 25.9959 0 27.3594 0H42.4266C43.79 0 44.8953 1.1053 44.8953 2.46875V17.0953C44.8953 19.8222 47.1059 22.0328 49.8328 22.0328H56.5313C57.8947 22.0328 59 23.1381 59 24.5016V39.5688C59 40.9322 57.8947 42.0375 56.5313 42.0375H27.3594C25.9959 42.0375 24.8906 40.9322 24.8906 39.5688Z" fill="#0F1A13"></path></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">Brandbuild</span>
    </a>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 32px">
      <form style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.05; letter-spacing: -0.03em">Create your account</h1>
          <p style="margin: 0; font-size: 16px; color: #3D4840">Already have one? <a href="LogIn.dc.html" style="font-weight: 600">Log in</a></p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button class="btn btn-ghost" type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C7CCC1; color: #0F1A13; font-size: 15px; font-weight: 600">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"></path><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#EA4335"></path></svg>Google</button>
          <button class="btn btn-ghost" type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C7CCC1; color: #0F1A13; font-size: 15px; font-weight: 600">
            <svg width="16" height="18" viewBox="0 0 24 24" fill="#0F1A13" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8a4.6 4.6 0 0 0-3.6-2c-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.8A5 5 0 0 0 3.6 9.5c-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5s1.7-.8 3.2-.8 1.9.8 3.3.8 2.2-1.2 3-2.4a10 10 0 0 0 1.4-2.8 4.3 4.3 0 0 1-2.5-4.4zM14 5.2A4.3 4.3 0 0 0 15 2a4.4 4.4 0 0 0-2.9 1.5 4.1 4.1 0 0 0-1 3.1A3.6 3.6 0 0 0 14 5.2z"></path></svg>Apple</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #5B655D"><span style="flex: 1; height: 1px; background: #D5D9CF"></span>or with email<span style="flex: 1; height: 1px; background: #D5D9CF"></span></div>
        <label class="lbl">Name<input class="in" type="text" autocomplete="name" value="Mary Mariella"></label>
        <label class="lbl">Email or phone number<input class="in" type="text" autocomplete="email" value="mary@novastudio.co"></label>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="pw" style="font-size: 14px; font-weight: 600">Password</label>
          <div style="position: relative">
            <input id="pw" class="in" type="{{pwType}}" autocomplete="new-password" aria-describedby="pw-rules" value="{{pw}}" onChange="{{onPw}}" style="padding-right: 52px">
            <button class="btn" type="button" onClick="{{toggleShow}}" aria-label="{{showLabel}}" aria-pressed="{{showPressed}}" style="position: absolute; top: 2px; right: 2px; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; background: transparent; color: #3D4840">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <ul id="pw-rules" aria-live="polite" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px">
            <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
              <li class="rule" style="color: {{r.fg}}">
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 9px; background: {{r.dot}}">
                  <sc-if value="{{r.ok}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
                </span>{{r.label}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.sr}}</span>
              </li>
            </sc-for>
          </ul>
        </div>
        <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.45; color: #2B352E; cursor: pointer">
          <input type="checkbox" checked="{{agree}}" onChange="{{toggleAgree}}" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: #12A150">
          <span>I agree to the <a href="Legal.dc.html">Terms</a> and <a href="Legal.dc.html">Privacy policy</a>.</span>
        </label>
        <a class="btn btn-primary" href="{{nextHref}}" aria-disabled="{{disabledAria}}" style="display: inline-flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 16px; font-weight: 600; text-decoration: none; pointer-events: {{ctaPointer}}">Create account</a>
        <span style="font-size: 13px; color: #5B655D; text-align: center">{{hint}}</span>
      </form>
    </div>
  </main>

  <aside class="side" aria-hidden="true" style="flex: 1 1 520px; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 56px; background: #0F2A1B; color: #E8F1EA">
    <p style="margin: 0; max-width: 460px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.02; letter-spacing: -0.04em; color: #FFFFFF">Five minutes from now, your first post is written.</p>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; max-width: 420px">
      <li style="display: flex; align-items: center; gap: 14px; font-size: 16px"><span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: #D4F25C; color: #0F2A1B; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">1</span>Create your account</li>
      <li style="display: flex; align-items: center; gap: 14px; font-size: 16px; color: #B9CBBE"><span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #335A43; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">2</span>Confirm you're a student (optional)</li>
      <li style="display: flex; align-items: center; gap: 14px; font-size: 16px; color: #B9CBBE"><span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #335A43; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">3</span>Connect your accounts</li>
      <li style="display: flex; align-items: center; gap: 14px; font-size: 16px; color: #B9CBBE"><span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #335A43; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">4</span>Teach it your voice</li>
    </ol>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pw: 'Marymariella', agree: false, show: false }; }
  renderVals() {
    var s = this.state, self = this, pw = s.pw || '';
    var defs = [
      { label: 'One capital letter', ok: /[A-Z]/.test(pw) },
      { label: 'One small letter', ok: /[a-z]/.test(pw) },
      { label: 'One number', ok: /[0-9]/.test(pw) },
      { label: '8 or more characters', ok: pw.length >= 8 }
    ];
    var rules = defs.map(function (r) { return { label: r.label, ok: r.ok, sr: r.ok ? ', done' : ', not yet', fg: r.ok ? '#0B5E2E' : '#5B655D', dot: r.ok ? '#12A150' : '#E3E5DD' }; });
    var allOk = defs.every(function (r) { return r.ok; });
    var ready = allOk && s.agree;
    var missing = !allOk ? 'Finish the password checklist to continue.' : (!s.agree ? 'Tick the box to agree to the terms.' : 'We’ll send a code to confirm your email.');
    return {
      pw: pw, rules: rules, agree: s.agree,
      pwType: s.show ? 'text' : 'password', showLabel: s.show ? 'Hide password' : 'Show password', showPressed: s.show ? 'true' : 'false',
      onPw: function (e) { self.setState({ pw: e.target.value }); },
      toggleShow: function () { self.setState({ show: !s.show }); },
      toggleAgree: function () { self.setState({ agree: !s.agree }); },
      ctaBg: ready ? '#12A150' : '#C9E7D5', ctaFg: ready ? '#FFFFFF' : '#4F6B5A', ctaPointer: ready ? 'auto' : 'none',
      disabledAria: ready ? 'false' : 'true', nextHref: 'Code.dc.html', hint: missing
    };
  }
}
</script>
</body>
</html>
