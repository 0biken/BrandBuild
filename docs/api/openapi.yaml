# The BrandBuild HTTP API contract. Both apps are held to this file:
# the web client in main-app/apps/web and the Rust API in backend/.
# x-status: matches (backend already conforms), adapt (route exists, shape differs), new (not built),
#   deferred (postponed; no phase until it is scheduled).
# x-phase: the roadmap phase that closes the gap.
openapi: 3.1.0
info:
  title: BrandBuild API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://brandbuild.app/terms
  description: |
    ## Conventions
    - JSON field names are camelCase. Timestamps are ISO 8601 UTC. IDs are opaque strings.
    - Success bodies are `{ "data": ... }`. Calls with nothing to return answer 204.
    - Every error body is `{ "error": { "code", "message" } }`.
    - The API returns data, not presentation. Colours, badges and formatted dates belong to the client.
    - Auth is the HttpOnly, SameSite=Lax `bb_session` cookie. The browser reaches the API through the
      same-origin Next rewrite at `/api/*`. A password-reset code sets a short-lived `bb_reset` cookie.

    ## Post states
    | Database state | Public state | Served by |
    |---|---|---|
    | draft | (draft) | /v1/drafts |
    | changes_requested | (draft, with feedback) | /v1/drafts |
    | in_review | approval | /v1/posts, /v1/approvals |
    | approved, scheduled | scheduled | /v1/posts |
    | publishing, reconciling | checking | /v1/posts |
    | published | published | /v1/posts |
    | failed, expired | failed | /v1/posts |
    | canceled | not returned | none |

    `paused` has no database state yet. Phase 7 adds it for posts held by a disconnected account.

    ## Roles
    Each workspace member has one role. A call outside the member's role answers 403 `forbidden`.
    | Action | owner | editor | reviewer |
    |---|---|---|---|
    | Drafts, posts, brand, media | yes | yes | yes |
    | Approve, request changes, schedule, publish, cancel | yes | no | yes |
    | Connected accounts, workspace settings | yes | no | no |

    ## Email and the student check
    - Signup, login codes and the student check send email. If sending fails the call answers 503
      `email_unavailable` and saves nothing, so it is safe to retry.
    - Login with the right password before the email is verified answers 403 `email_not_verified`.
      The client then requests a fresh code.
    - A school email ends in `.edu`, `.edu.<country>` or `.ac.<country>`, or is on a domain in the API's
      `STUDENT_EMAIL_DOMAINS` setting.
servers:
  - url: /api
    description: Same-origin rewrite in the web app
tags:
