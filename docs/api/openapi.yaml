                  data: {type: array, items: {$ref: '#/components/schemas/StatItem'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: getAnalytics
      x-status: adapt
      x-phase: 7
      parameters:
        - {name: range, in: query, required: true, schema: {$ref: '#/components/schemas/AnalyticsRange'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AnalyticsReport'}
        default: {$ref: '#/components/responses/Error'}
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: listNotifications
      x-status: new
      x-phase: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AppNotification'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: markNotificationRead
      x-status: new
      x-phase: 4
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AppNotification'}
        default: {$ref: '#/components/responses/Error'}
  /v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: markAllNotificationsRead
      x-status: new
      x-phase: 4
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Error'}
  /v1/settings/notifications:
    get:
      operationId: getNotificationPrefs
      tags: [notifications]
      summary: getNotificationPrefs
      x-status: new
      x-phase: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/NotificationPrefs'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateNotificationPrefs
      tags: [notifications]
      summary: updateNotificationPrefs
      x-status: new
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPrefsInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/NotificationPrefs'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: bb_session}
  responses:
    Error:
      description: Any failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                invalid_request, invalid_input, invalid_credentials, invalid_code (400, 401, 415, 422);
                unauthorized (401); forbidden, email_not_verified (403); not_found (404);
                account_exists, conflict (409); code_expired (410); rate_limited (429);
                internal_error (500); not_available (501); auth_not_configured, email_unavailable (503).
            message: {type: string}
    SignUpInput:
      type: object
      required: [name, identifier, password]
      properties: {name: {type: string}, identifier: {type: string}, password: {type: string}}
    LogInInput:
      type: object
      required: [identifier, password]
      properties: {identifier: {type: string}, password: {type: string}}
    RequestCodeInput:
      type: object
      required: [identifier]
      properties: {identifier: {type: string}}
    VerifyCodeInput:
      type: object
      required: [identifier, code]
      properties: {identifier: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}}
    ResetPasswordInput:
      type: object
      required: [password]
      description: The account comes from the bb_reset cookie.
      properties: {password: {type: string}}
    Role: {type: string, enum: [owner, editor, reviewer]}
    Session:
      type: object
      required: [userId, name, identifier, role]
      properties:
        userId: {type: string}
        name: {type: string}
        identifier: {type: string}
        role: {$ref: '#/components/schemas/Role'}
    StudentEmailInput:
      type: object
      required: [email]
      properties: {email: {type: string}}
    CodeOnlyInput:
      type: object
      required: [code]
      properties: {code: {type: string}}
    StudentCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, code_sent, verified, pending_review, not_student]
          description: pending_review is reserved for student ID review, which is deferred.
        method: {type: string, enum: [email, id]}
        email: {type: string}
    StepStatus: {type: string, enum: [todo, done, skipped]}
    StepInput:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [done, skipped]}}
    OnboardingState:
      type: object
      required: [verify, connect, brand]
      properties:
        verify: {$ref: '#/components/schemas/StepStatus'}
        connect: {$ref: '#/components/schemas/StepStatus'}
        brand: {$ref: '#/components/schemas/StepStatus'}
    PlatformId: {type: string, enum: [ig, li, tt, fb]}
    AccountPlatform: {type: string, enum: [ig, li, tt, fb, yt]}
    MediaRef:
      type: object
      required: [id, name, kind, type, size, addedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [image, video]}
        type: {type: string, description: MIME type}
        size: {type: integer}
        duration: {type: number, description: "Seconds, for videos"}
        addedAt: {type: string, format: date-time}
        url: {type: string}
    PostState: {type: string, enum: [scheduled, approval, published, failed, checking, paused]}
    Notice:
      type: object
      required: [title, message]
      description: Why a post is failed, being checked or paused.
      properties: {title: {type: string}, message: {type: string}}
    Person:
      type: object
      required: [name]
      properties: {name: {type: string}}
    Post:
      type: object
      required: [id, title, caption, hashtags, aspectRatio, state, platforms, activity]
      properties:
        id: {type: string}
        title: {type: string}
        caption: {type: string}
        hashtags: {type: array, items: {type: string}}
        aspectRatio: {type: string}
        scheduledAt: {type: string, format: date-time}
        state: {$ref: '#/components/schemas/PostState'}
        platforms: {type: array, items: {$ref: '#/components/schemas/PlatformId'}}
        platformStatuses:
          type: array
          items:
            type: object
            required: [id, status, live]
            properties:
              id: {$ref: '#/components/schemas/PlatformId'}
              status: {type: string}
              note: {type: string}
              live: {type: boolean}
              liveUrl: {type: string}
        metrics:
          type: object
          required: [reach, likes, comments, saves]
          properties: {reach: {type: integer}, likes: {type: integer}, comments: {type: integer}, saves: {type: integer}}
        activity:
          type: array
          items:
            type: object
            required: [text, at]
            properties: {text: {type: string}, at: {type: string, format: date-time}}
        media: {type: array, items: {$ref: '#/components/schemas/MediaRef'}}
        reviewer:
          type: object
          required: [name, note]
          properties: {name: {type: string}, note: {type: string}}
        requestedBy: {$ref: '#/components/schemas/Person'}
        requestedAt: {type: string, format: date-time}
        notice: {$ref: '#/components/schemas/Notice'}
    PostInput:
      type: object
      required: [title, caption, hashtags, platforms, intent]
      properties:
        title: {type: string}
        caption: {type: string}
        hashtags: {type: array, items: {type: string}}
        platforms: {type: array, items: {$ref: '#/components/schemas/PlatformId'}}
        scheduledAt: {type: string, format: date-time}
        intent: {type: string, enum: [schedule, publish, approval]}
        aspectRatio: {type: string}
        media: {type: array, items: {$ref: '#/components/schemas/MediaRef'}}
    ScheduleInput:
      type: object
      required: [scheduledAt]
      properties: {scheduledAt: {type: string, format: date-time}}
    PostStateInput:
      type: object
      required: [state]
      properties: {state: {$ref: '#/components/schemas/PostState'}}
    ChangesInput:
      type: object
      required: [note]
      properties: {note: {type: string}}
    DecisionReceipt:
      type: object
      required: [decision, postId]
      properties:
        decision: {type: string, enum: [approve, changes, reject]}
        postId: {type: string}
        post: {$ref: '#/components/schemas/Post'}
        draftId: {type: string}
    DraftState: {type: string, enum: [ready, needs_photo, idea]}
    Draft:
      type: object
      required: [id, title, body, state, platforms, updatedAt]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        state: {$ref: '#/components/schemas/DraftState'}
        platforms: {type: array, items: {$ref: '#/components/schemas/PlatformId'}}
        updatedAt: {type: string, format: date-time}
        feedback: {type: string}
        media: {type: array, items: {$ref: '#/components/schemas/MediaRef'}}
    DraftInput:
      type: object
      description: On PATCH every field is optional.
      properties:
        title: {type: string}
        body: {type: string}
        state: {$ref: '#/components/schemas/DraftState'}
        platforms: {type: array, items: {$ref: '#/components/schemas/PlatformId'}}
        media: {type: array, items: {$ref: '#/components/schemas/MediaRef'}}
    DeletedDraft:
      type: object
      required: [index]
      description: The draft's old list position, used by undo.
      properties: {index: {type: integer}}
    AccountStatus: {type: string, enum: [connected, needs_attention, disconnected, connecting, declined]}
    ConnectedAccount:
      type: object
      required: [id, platform, handle, status]
      properties:
        id: {type: string}
        platform: {$ref: '#/components/schemas/AccountPlatform'}
        handle: {type: string}
        followers: {type: integer}
        status: {$ref: '#/components/schemas/AccountStatus'}
    Platform:
      type: object
      required: [id, name, limit]
      properties:
        id: {$ref: '#/components/schemas/PlatformId'}
        name: {type: string}
        limit: {type: integer, description: Caption character limit}
        enabled: {type: boolean}
    Tone: {type: string, enum: [Warm, Playful, Professional, Bold]}
    BrandProfile:
      type: object
      required: [name, sells, audience, tones, wordsUse, wordsAvoid, color, samples]
      properties:
        name: {type: string}
        sells: {type: string}
        audience: {type: array, items: {type: string}}
        tones: {type: array, items: {$ref: '#/components/schemas/Tone'}, maxItems: 2}
        wordsUse: {type: array, items: {type: string}}
        wordsAvoid: {type: array, items: {type: string}}
        color: {type: string, description: Hex}
        palette: {type: array, items: {type: string}, maxItems: 3}
        logo: {type: string, description: Data URL until Phase 4 moves it to a media URL}
        fonts:
          type: object
          required: [heading, body]
          properties: {heading: {type: string}, body: {type: string}}
        samples: {type: string}
    Brand:
      allOf:
        - {$ref: '#/components/schemas/BrandProfile'}
        - type: object
          required: [id, voice, plan]
          properties:
            id: {type: string}
            voice: {type: string}
            plan: {type: string, enum: [student, creator, business]}
            planEndsAt: {type: string, format: date-time}
    GenerateInput:
      type: object
      required: [idea, tone, platforms]
      properties:
        idea: {type: string}
        tone: {type: string}
        platforms: {type: array, items: {$ref: '#/components/schemas/PlatformId'}}
        tweak: {type: string}
        caption: {type: string}
    Generated:
      type: object
      required: [caption, hashtags, bestTime]
      properties:
        caption: {type: string}
        hashtags: {type: array, items: {type: string}}
        bestTime: {type: string, format: date-time}
    StatItem:
      type: object
      required: [key, value, previous, spark]
      properties:
        key: {type: string}
        value: {type: number}
        previous: {type: number}
        spark: {type: array, items: {type: number}}
    AnalyticsRange: {type: string, enum: [7d, 30d, 90d]}
    AnalyticsTotals:
      type: object
      required: [reach, engagements, followers, posts]
      properties: {reach: {type: integer}, engagements: {type: integer}, followers: {type: integer}, posts: {type: integer}}
    PostPerformance:
      type: object
      required: [id, title, format, platforms, postedAt, reach, engagements, saves, hashtags, captionLength]
      properties:
        id: {type: string}
        title: {type: string}
        format: {type: string, enum: [Reel, Carousel, Photo, Video]}
        platforms: {type: array, items: {$ref: '#/components/schemas/PlatformId'}}
        postedAt: {type: string, format: date-time}
        reach: {type: integer}
        engagements: {type: integer}
        saves: {type: integer}
        hashtags: {type: integer}
        captionLength: {type: integer}
    AnalyticsReport:
      type: object
      required: [range, from, to, totals, previous, daily, platforms, heatmap, posts, accounts]
      properties:
        range: {$ref: '#/components/schemas/AnalyticsRange'}
        from: {type: string, format: date}
        to: {type: string, format: date}
        totals: {$ref: '#/components/schemas/AnalyticsTotals'}
        previous: {$ref: '#/components/schemas/AnalyticsTotals'}
        daily:
          type: array
          items:
            type: object
            required: [date, engagements, previous]
            properties: {date: {type: string, format: date}, engagements: {type: integer}, previous: {type: integer}}
        platforms:
          type: array
          items:
            type: object
            required: [id, name, engagements]
            properties: {id: {$ref: '#/components/schemas/PlatformId'}, name: {type: string}, engagements: {type: integer}}
        heatmap:
          type: array
          description: 7 weekdays (0 is Monday) by 6 three-hour slots from 6 AM, scored 0 to 1.
          items: {type: array, items: {type: number}}
        posts: {type: array, items: {$ref: '#/components/schemas/PostPerformance'}}
        accounts:
          type: array
          items:
            type: object
            required: [platform, handle, status]
            properties: {platform: {type: string}, handle: {type: string}, status: {$ref: '#/components/schemas/AccountStatus'}}
    AppNotification:
      type: object
      required: [id, kind, title, body, at, read, href]
      properties:
        id: {type: string}
        kind: {type: string, enum: [approval, failed, reconnect, published, insights]}
        title: {type: string}
        body: {type: string}
        at: {type: string, format: date-time}
        read: {type: boolean}
        href: {type: string}
    NotificationPrefs:
      type: object
      required: [postReminders, scheduledAlerts, weeklyInsights]
      properties: {postReminders: {type: boolean}, scheduledAlerts: {type: boolean}, weeklyInsights: {type: boolean}}
    NotificationPrefsInput:
      type: object
      properties: {postReminders: {type: boolean}, scheduledAlerts: {type: boolean}, weeklyInsights: {type: boolean}}
