  - {name: onboarding, description: Student check and setup steps}
  - {name: content, description: Drafts and posts}
  - {name: approvals, description: Review decisions}
  - {name: accounts, description: Connected social accounts}
  - {name: brand, description: Brand kit}
  - {name: ai, description: Post generation}
  - {name: media, description: Photo and video library}
  - {name: analytics, description: Performance reporting}
  - {name: notifications, description: Inbox and preferences}
