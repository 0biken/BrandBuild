name: web

on:
  pull_request:
    paths: ["main-app/apps/web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["main-app/apps/web/**", ".github/workflows/web.yml"]

defaults:
  run:
    working-directory: main-app/apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-app/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: main-app/apps/web/test-results
          retention-days: 7
