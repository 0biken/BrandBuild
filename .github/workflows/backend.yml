name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brandbuild
          POSTGRES_PASSWORD: brandbuild
          POSTGRES_DB: brandbuild
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brandbuild -d brandbuild"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # tests/db.rs creates the app role, migrates as the owner, then connects as brandbuild_app.
      TEST_DATABASE_URL: postgres://brandbuild:brandbuild@localhost:5432/brandbuild
      TEST_APP_DATABASE_URL: postgres://brandbuild_app:brandbuild_app@localhost:5432/brandbuild
      TEST_ADMIN_DATABASE_URL: postgres://brandbuild_admin:brandbuild_admin@localhost:5432/brandbuild
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test -- --test-threads=1
