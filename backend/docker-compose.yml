services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brandbuild
      POSTGRES_PASSWORD: brandbuild
      POSTGRES_DB: brandbuild
    ports:
      - "5432:5432"
    volumes:
      - brandbuild_pg:/var/lib/postgresql/data
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandbuild -d brandbuild"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Local test inbox: the API sends codes here (SMTP on 1025), read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  brandbuild_pg:
