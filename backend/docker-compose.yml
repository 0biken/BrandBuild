services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brandbuild
      POSTGRES_PASSWORD: brandbuild
      POSTGRES_DB: brandbuild
    ports:
      - "5432:5432"
    volumes:
      - brandbuild_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandbuild -d brandbuild"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  brandbuild_pg:
